name: Daily IPO Check (Mon-Fri)

on:
  schedule:
    # Rulează de Luni până Vineri la ora 11:00 ora României (08:00 UTC)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Îți permite să îl testezi manual oricând dorești

jobs:
  check-ipo:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul din proiect
        uses: actions/checkout@v4

      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalează dependențele
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execută scriptul de verificare
        run: python main.py
