name: Verificare IPO zilnica

on:
  schedule:
    # GitHub Actions foloseste UTC, nu ora Romaniei.
    # Ora Romaniei este UTC+2 iarna (EET) si UTC+3 vara (EEST).
    # Pentru ora 11:00 Romania -> 09:00 UTC iarna / 08:00 UTC vara.
    - cron: '0 9 * * 1-5'   # 11:00 Romania, perioada de iarna
    - cron: '0 8 * * 1-5'   # 11:00 Romania, perioada de vara
  workflow_dispatch: {}      # permite rulare manuala din tab-ul Actions, pentru testare

permissions:
  contents: write   # necesar ca scriptul sa poata face commit la fisierul de stare

jobs:
  check-ipo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ruleaza scriptul de verificare
        run: python main.py

      - name: Salveaza fisierul de stare (daca s-a schimbat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_filings.json
          git diff --staged --quiet || git commit -m "Actualizeaza fisierul de stare IPO"
          git push
